.ann{background:var(--ac);color:#1a1200;text-align:center;padding:.5rem;font-weight:700}
.hero{position:relative;min-height:64vh;display:flex;align-items:flex-end;gap:2rem;padding:10vh 4vw 5vh;overflow:hidden;flex-wrap:wrap}
.hero .bgimg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.5}
.hero:after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,var(--bg) 5%,transparent 70%)}
.hero>div,.hero>.pp{position:relative;z-index:1}
.hero .pp{width:170px;border-radius:var(--r);transform:rotate(-3deg);box-shadow:8px 8px 0 var(--ac)}
.hero div{max-width:640px}.hero h1{font-size:clamp(2.2rem,7vw,4.4rem);line-height:.95;letter-spacing:-.04em;margin-bottom:.5rem}

.sec{padding:1.5rem 4vw}.sec h2{margin-bottom:.8rem;font-size:1.4rem}

.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}

.empty{grid-column:1/-1;color:var(--mu);padding:2rem;text-align:center}

.stars button{background:none;font-size:2rem;color:var(--ac);padding:0 .1em}
.br{display:flex;align-items:center;gap:8px;font-size:.85rem}.br span{width:2.4em}.br b{width:3em;text-align:right}

label{display:block;margin:.5rem 0 .2rem;color:var(--mu)}label input,label select,label textarea{margin-top:.2rem}
.ck{display:inline-block;margin:.2rem .6rem .2rem 0;color:var(--tx)}.ck input{width:auto}
fieldset{border:1px solid #3a418a;border-radius:8px;padding:.4rem .8rem;margin:.6rem 0}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:.8rem 0}.tabs .on{background:var(--ac);color:#1a1200}
.note{background:#3a2d12;border-left:4px solid var(--ac);padding:.6rem;border-radius:8px;margin-bottom:1rem}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}
.stats div{background:var(--bg);border-radius:var(--r);padding:1rem}.stats b{display:block;font-size:2rem;color:var(--ac)}
.row{background:var(--bg);border-radius:12px;padding:.7rem;margin:8px 0}.sub{margin:.4rem 0 0 1rem}.sub2{margin-left:1.2rem;font-size:.9rem;color:var(--mu)}
.tw{overflow-x:auto}table{border-collapse:collapse;width:100%}td,th{padding:.4rem .6rem;border-bottom:1px solid #2a3060;text-align:left}
.err{color:#ff8a9d;min-height:1.5em}#aq{margin-bottom:.8rem}.maint main{display:none}.maint:before{content:"We are updating the site. Please check back soon.";display:block;padding:25vh 4vw;font-size:1.6rem;text-align:center}
footer{padding:2rem 4vw;background:var(--sf);margin-top:2rem;color:var(--mu);font-size:.9rem}footer h3{color:var(--tx)}footer p{margin:.5rem 0;max-width:80ch}footer a{color:var(--ac2);margin-right:1rem}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

function ratingHTML(x){const r=x.ratings,t=cnt(r),mine=+localStorage.getItem(`ratingGiven_${x.type}_${x.id}`)||0;
return`<p><b>⭐ ${calculateAverageRating(r).toFixed(1)} / 5</b> • ${t} Ratings</p><div class="stars">${[1,2,3,4,5].map(n=>`<button data-a="rate" data-i="${x.id}" data-j="${n}" aria-label="${n} star${n>1?"s":""}">${n<=mine?"★":"☆"}</button>`).join("")}</div>`+[5,4,3,2,1].map(n=>`<div class="br"><span>${n} ⭐</span><div class="bar"><i style="width:${t?r[n-1]/t*100:0}%"></i></div><b>${t?Math.round(r[n-1]/t*100):0}%</b></div>`).join("")}
function openTitle(id){const x=item(id);if(!x)return;const c=x.type!="movie",wait=x.releaseAt>Date.now(),ne=c?x.seasons.reduce((a,s)=>a+s.eps.length,0):0,
info=(q,s)=>`<small>${esc(q)} • ${esc(s)} • ${esc(x.lang)}</small>`,dis=wait?"disabled":"";
const body=c?(x.seasons.length?x.seasons.sort((a,b)=>a.num-b.num).map(s=>`<details><summary>Season ${s.num}${s.name?" — "+esc(s.name):""} (${s.eps.length} episodes)</summary>${s.eps.map(e=>`<div class="ep"><div><b>Episode ${String(e.num).padStart(2,"0")} — ${esc(e.title)}</b><small>${esc(e.desc)}</small>${info(e.quality,e.size)}</div><button class="pri" data-a="dle" data-i="${x.id}" data-j="${s.id}" data-k="${e.id}" ${dis}>DOWNLOAD</button></div>`).join("")||'<p class="mu">No episodes yet.</p>'}</details>`).join(""):'<p class="mu">No seasons yet.</p>'):
(x.downloads.map((d,n)=>`<div class="ep"><div>${info(d.quality,d.size)}</div><button class="pri" data-a="dlm" data-i="${x.id}" data-j="${n}" ${dis}>DOWNLOAD</button></div>`).join("")||'<p class="mu">No download links yet.</p>');
$("#dbx").innerHTML=`<button class="x" data-a="close" aria-label="Close">✕</button><img class="ban" src="${esc(back(x))}" alt=""><div class="dh"><img class="pp" src="${esc(poster(x))}" alt="Poster of ${esc(x.title)}"><div><h2>${esc(x.title)}</h2><p class="mu">${x.year} • ${esc(x.lang)} • ${esc(x.genres.join(", "))} • ${c?esc(x.status):esc(x.runtime||"")}</p><p>${esc(x.desc)}</p>${c?`<p class="mu">${x.seasons.length} seasons • ${ne} episodes</p>`:""}${wait?`<p class="cd">⏳ Releases in <b data-t="${x.releaseAt}"></b></p>`:""}</div></div><h3>${c?"Seasons":"Download options"}</h3>${body}<h3>⭐ RATE THIS ${x.type=="anime"?"ANIME":c?"CARTOON":"MOVIE"}</h3><div id="rt">${ratingHTML(x)}</div><p id="rm" role="status"></p><button class="sm" data-a="rep" data-i="${x.id}">⚠ Report a broken link</button>`;
$("#dm").classList.add("on")}
function submitRating(id,n){const x=item(id),k=`ratingGiven_${x.type}_${id}`;if(localStorage.getItem(k)){$("#rm").textContent="You have already rated this title.";return}
const done=()=>{localStorage.setItem(k,n);$("#rt").innerHTML=ratingHTML(item(id));$("#rm").textContent="Thanks for rating!";renderHome()};
if(fbOn){const r=fs.collection("items").doc(id);fs.runTransaction(async t=>{const a=(await t.get(r)).data().ratings;a[n-1]++;t.update(r,{ratings:a})}).then(()=>{x.ratings[n-1]++;done()}).catch(fbErr);return}
x.ratings[n-1]++;saveDatabase();done()}
function bump(id){if(fbOn)fs.collection("items").doc(id).update({dl:firebase.firestore.FieldValue.increment(1)}).catch(()=>{});else{const x=item(id);x.dl=(x.dl||0)+1;saveDatabase()}}
function downloadEpisode(i,j,k){const x=item(i);if(x.releaseAt>Date.now())return alert("Not released yet.");bump(i);window.open(season(i,j).eps.find(e=>e.id==k).url,"_blank","noopener")}
function downloadMovie(i,j){const x=item(i);if(x.releaseAt>Date.now())return alert("Not released yet.");bump(i);window.open(x.downloads[j].url,"_blank","noopener")}
setInterval(()=>document.querySelectorAll("[data-t]").forEach(e=>{const d=+e.dataset.t-Date.now();e.textContent=d>0?`${Math.floor(d/864e5)}d ${Math.floor(d%864e5/36e5)}h ${Math.floor(d%36e5/6e4)}m ${Math.floor(d%6e4/1e3)}s`:"Available now. Reopen to download."}),1000);
/* ===== ADMIN ===== */
function openAdminLogin(){$("#lc").value="";$("#le").textContent="";$("#lg").classList.add("on");$("#lc").focus()}
function verifyAdmin(){if($("#lc").value!==ADMIN_CODE)return $("#le").textContent="Incorrect Admin Code";$("#lg").classList.remove("on");
if(fbOn&&FIREBASE_LOGIN&&!fbAuth.currentUser)ask("Admin sign in (Firebase)",[["email","Admin email","email"],["pw","Password","password"]],{},v=>{fbAuth.signInWithEmailAndPassword(v.email,v.pw).then(openAdminPanel).catch(e=>alert("Sign in failed: "+e.message))});else openAdminPanel()}
function bulkEpisodes(i,j){const s=season(i,j);ask("Bulk add episodes",[["lines","One episode per line:  Title | Quality | Size | MediaFire URL","textarea"]],{lines:""},v=>{let n=s.eps.reduce((a,e)=>Math.max(a,e.num),0),bad=0;
v.lines.split("\n").map(l=>l.trim()).filter(Boolean).forEach(l=>{const[t,q,z,u]=l.split("|").map(p=>p.trim());if(!/^https?:\/\//i.test(u||"")){bad++;return}s.eps.push({id:uid(),num:++n,title:t||"Episode "+n,desc:"",quality:q||"720p",size:z||"",url:u})});
if(bad)alert(bad+" line(s) skipped: each needs 4 parts and a https:// link at the end.");commit()})}
function openAdminPanel(){$("#adm").classList.add("on");renderAdminDashboard()}
function closeAdmin(){$("#adm").classList.remove("on")}
const b=(a,i,j,k,l,c="")=>`<button class="sm ${c}" data-a="${a}" data-i="${i??""}" data-j="${j??""}" data-k="${k??""}">${l}</button>`;
const CF=[["title","Title","text"],["poster","Poster URL (blank = placeholder)","text"],["backdrop","Backdrop URL","text"],["desc","Description","textarea"],["year","Release year","number"],["lang","Language","select",ll],["genres","Genres","multi",gl],["chars","Characters (comma separated)","text"],["status","Status","select",["Ongoing","Completed","Upcoming"]],["releaseAt","Release time (optional, shows a countdown)","datetime"],["featured","Featured","check"],["trending","Trending","check"],["hidden","Hidden from visitors (draft)","check"]],
MF=[...CF.filter(f=>f[0]!="status"),["runtime","Runtime (e.g. 1h 45m)","text"]],SF=[["num","Season number","number"],["name","Season name","text"]],
EF=[["num","Episode number","number"],["title","Episode title","text"],["desc","Description","textarea"],["quality","Quality","select",QUAL],["size","File size (e.g. 450 MB)","text"],["url","MediaFire URL","url"]],
DF=[["quality","Quality","select",QUAL],["size","File size (e.g. 1.2 GB)","text"],["url","MediaFire URL","url"]],
AF=[["text","Announcement","text"],["on","Show on homepage","check"]],
STF=[["name","Website name","text"],["desc","Website description","text"],["logo","Logo URL","text"],["banner","Hero banner image URL","text"],["copy","Copyright text","text"],["contact","Contact information","text"],["social","Social links (one per line)","textarea"],["xg","Extra genres (comma separated)","text"],["xl","Extra languages (comma separated)","text"],["accent","Accent color","color"],["maintenance","Maintenance mode (hides the site from visitors)","check"]];
function ask(title,F,v,cb){$("#fb").innerHTML=`<h3>${title}</h3><form id="f">${F.map(([k,l,t,o])=>{if(typeof o=="function")o=o();const val=v[k];
if(t=="multi")return`<fieldset><legend>${l}</legend>${o.map(x=>`<label class="ck"><input type="checkbox" name="${k}" value="${x}" ${(val||[]).includes(x)?"checked":""}> ${x}</label>`).join("")}</fieldset>`;
if(t=="check")return`<label class="ck"><input type="checkbox" name="${k}" ${val?"checked":""}> ${l}</label>`;
const rq=["title","text","url"].includes(k)?"required":"";let c;
if(t=="textarea")c=`<textarea name="${k}" rows="3">${esc(val)}</textarea>`;
else if(t=="select")c=`<select name="${k}">${o.map(x=>`<option ${x==val?"selected":""}>${x}</option>`).join("")}</select>`;
else if(t=="datetime")c=`<input type="datetime-local" name="${k}" value="${val?new Date(val-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,16):""}">`;
else c=`<input type="${t}" name="${k}" value="${esc(val)}" ${rq}>`;
return`<label>${l}${c}</label>`}).join("")}<div class="acts"><button class="pri">Save</button><button type="button" data-a="closeF">Cancel</button></div></form>`;
$("#fm").classList.add("on");
$("#f").onsubmit=e=>{e.preventDefault();const d=new FormData(e.target),r={};
F.forEach(([k,,t])=>{r[k]=t=="multi"?d.getAll(k):t=="check"?d.has(k):t=="number"?+d.get(k):t=="datetime"?(d.get(k)?new Date(d.get(k)).getTime():0):d.get(k).trim()});
if(cb(r)!==false)$("#fm").classList.remove("on")}}
function addContent(type){ask("Add "+type,type=="movie"?MF:CF,{year:new Date().getFullYear(),lang:"English",genres:[],status:"Ongoing"},v=>{db.items.push({id:uid(),type,created:Date.now(),seasons:[],downloads:[],ratings:[0,0,0,0,0],...v});commit()})}
function editContent(i){const x=item(i);ask("Edit "+esc(x.title),x.type=="movie"?MF:CF,x,v=>{Object.assign(x,v);commit()})}
function deleteContent(i){const x=item(i);if(confirm(`Delete "${x.title}" and everything inside it? This cannot be undone.`)){db.items=db.items.filter(y=>y.id!=i);commit()}}
function toggle(i,k){const x=item(i);x[k]=!x[k];commit()}
function addSeason(i){const c=item(i);ask("Add season",SF,{num:c.seasons.length+1,name:""},v=>{c.seasons.push({id:uid(),eps:[],...v});commit()})}
function editSeason(i,j){const s=season(i,j);ask("Edit season",SF,s,v=>{Object.assign(s,v);commit()})}
function deleteSeason(i,j){if(confirm("Delete this season and its episodes?")){const c=item(i);c.seasons=c.seasons.filter(s=>s.id!=j);commit()}}
function addEpisode(i,j){const s=season(i,j);ask("Add episode",EF,{num:s.eps.length+1,quality:"720p"},v=>{if(!okUrl(v.url))return false;s.eps.push({id:uid(),...v});s.eps.sort((a,b)=>a.num-b.num);commit()})}
function editEpisode(i,j,k){const e=season(i,j).eps.find(x=>x.id==k);ask("Edit episode",EF,e,v=>{if(!okUrl(v.url))return false;Object.assign(e,v);commit()})}
function deleteEpisode(i,j,k){if(confirm("Delete this episode?")){const s=season(i,j);s.eps=s.eps.filter(e=>e.id!=k);commit()}}
function addDownload(i){const m=item(i);ask("Add download option",DF,{quality:"720p"},v=>{if(!okUrl(v.url))return false;m.downloads.push(v);commit()})}
function editDownload(i,j){const d=item(i).downloads[j];ask("Edit download option",DF,d,v=>{if(!okUrl(v.url))return false;Object.assign(d,v);commit()})}
function deleteDownload(i,j){if(confirm("Delete this download option?")){item(i).downloads.splice(j,1);commit()}}
function resetRating(i){const x=item(i);if(confirm(`Reset all ratings for "${x.title}"?`)){x.ratings=[0,0,0,0,0];localStorage.removeItem(`ratingGiven_${x.type}_${x.id}`);commit()}}
function resetAllRatings(){if(confirm("Reset ALL ratings for every title?")){db.items.forEach(x=>{x.ratings=[0,0,0,0,0];localStorage.removeItem(`ratingGiven_${x.type}_${x.id}`)});commit()}}
function exportData(){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(db,null,2)],{type:"application/json"}));a.download="anime-world-backup-"+new Date().toISOString().slice(0,10)+".json";a.click()}
function importData(file){const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!Array.isArray(d.items)||!d.settings||!Array.isArray(d.announcements))throw 0;if(confirm("Replace ALL current data with this backup?")){db=d;commit();alert("Data restored.")}}catch(e){alert("That file is not a valid backup.")}$("#imp").value=""};r.readAsText(file)}
function resetDemo(){if(confirm("Reset to the original demo data? All your changes will be lost"+(fbOn?" for ALL visitors":"")+".")){db=seed();commit()}}
function gl(){return[...GENRES.filter(g=>g!="Other"),...(db.settings.xg||"").split(",").map(x=>x.trim()).filter(Boolean),"Other"]}
function ll(){return[...LANGS.filter(g=>g!="Other"),...(db.settings.xl||"").split(",").map(x=>x.trim()).filter(Boolean),"Other"]}
function selectAll(){const t=tab=="Anime"?"anime":tab=="Movies"?"movie":"cartoon",q=$("#aq").value.toLowerCase();db.items.filter(x=>x.type==t&&x.title.toLowerCase().includes(q)).forEach(x=>sel.add(x.id));renderAdminDashboard()}
function bulkAction(op){const l=db.items.filter(x=>sel.has(x.id));if(!l.length)return alert("Tick some titles first.");
if(op=="del"){if(!confirm(`Delete ${l.length} title(s)? This cannot be undone.`))return;db.items=db.items.filter(x=>!sel.has(x.id))}
else l.forEach(x=>{const[k,v]={feat:["featured",1],unfeat:["featured",0],trend:["trending",1],untrend:["trending",0],hide:["hidden",1],show:["hidden",0]}[op];x[k]=!!v});sel.clear();commit()}
function duplicateContent(i){const c=JSON.parse(JSON.stringify(item(i)));c.id=uid();c.created=Date.now();c.title+=" (copy)";c.hidden=true;c.ratings=[0,0,0,0,0];c.dl=0;(c.seasons||[]).forEach(z=>{z.id=uid();z.eps.forEach(e=>e.id=uid())});db.items.push(c);commit()}
function setRatings(i){const x=item(i);ask("Set rating counts: "+esc(x.title),[1,2,3,4,5].map(n=>["r"+n,n+" star votes","number"]),Object.fromEntries(x.ratings.map((n,k)=>["r"+(k+1),n])),v=>{x.ratings=[v.r1,v.r2,v.r3,v.r4,v.r5].map(n=>Math.max(0,Math.round(n)||0));commit()})}
function reportLink(i){const x=item(i);if(localStorage.getItem("rep_"+i))return alert("You already reported this title. Thank you!");(db.reports=db.reports||[]).push({id:uid(),itemId:i,title:x.title,created:Date.now()});localStorage.setItem("rep_"+i,1);saveDatabase();alert("Thanks! The admin has been told.")}
function bulkDownloads(i){const m=item(i);ask("Bulk add downloads",[["lines","One per line:  Quality | Size | MediaFire URL","textarea"]],{lines:""},v=>{let bad=0;v.lines.split("\n").map(l=>l.trim()).filter(Boolean).forEach(l=>{const[q,z,u]=l.split("|").map(p=>p.trim());if(!/^https?:\/\//i.test(u||"")){bad++;return}m.downloads.push({quality:q||"720p",size:z||"",url:u})});if(bad)alert(bad+" line(s) skipped: need Quality | Size | https:// link.");commit()})}
function exportLinks(){const R=[["Type","Title","Season","Episode","Quality","Size","URL"]];db.items.forEach(x=>x.type=="movie"?(x.downloads||[]).forEach(d=>R.push([x.type,x.title,"","",d.quality,d.size,d.url])):x.seasons.forEach(z=>z.eps.forEach(e=>R.push([x.type,x.title,z.num,e.num,e.quality,e.size,e.url]))));
const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([R.map(r=>r.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(",")).join("\n")],{type:"text/csv"}));a.download="anime-world-links.csv";a.click()}
function renderAdminDashboard(){const C=db.items.filter(x=>x.type!="movie"),M=db.items.filter(x=>x.type=="movie"),T=["Dashboard","Cartoons","Anime","Movies","Ratings","Reports","Announcements","Settings","Security","Backup"],aq=$("#aq").value.toLowerCase(),mine=t=>db.items.filter(x=>x.type==t&&x.title.toLowerCase().includes(aq)).sort((a,b)=>b.created-a.created),
sn=C.reduce((a,c)=>a+c.seasons.length,0),ep=C.reduce((a,c)=>a+c.seasons.reduce((z,s)=>z+s.eps.length,0),0),
st=(n,l)=>`<div><b>${n}</b>${l}</div>`;
$("#aq").style.display=["Cartoons","Anime","Movies"].includes(tab)?"":"none";$("#tabs").innerHTML=T.map(t=>`<button class="${t==tab?"on":""}" data-a="tab" data-i="${t}">${t}</button>`).join("");
let h='<p class="note">IMPORTANT: Only upload or link to content that you have the legal right or permission to distribute.</p>';
if(tab=="Dashboard")h+=`<div class="stats">${st(C.filter(x=>x.type=="cartoon").length,"Total Cartoons")+st(C.filter(x=>x.type=="anime").length,"Total Anime")+st(M.length,"Total Movies")+st(sn,"Total Seasons")+st(ep,"Total Episodes")+st(db.items.reduce((a,x)=>a+cnt(x.ratings),0),"Total Ratings")+st(ep+M.reduce((a,m)=>a+m.downloads.length,0),"Total Download Links")+st(db.items.reduce((a,x)=>a+(x.dl||0),0),"Download Clicks")}</div>`;
if(tab=="Dashboard")h+=`<p>${fbOn?"☁️ Online database connected: every visitor sees your changes.":"💾 Local-only mode: paste your Firebase config to go online."}</p>`+(fbOn&&FIREBASE_LOGIN?b("out","","","","Sign out of admin"):"")+"<h3>Most downloaded</h3>"+[...db.items].sort((p,q)=>(q.dl||0)-(p.dl||0)).slice(0,5).map(x=>`<div class="sub2">${esc(x.title)} • ${x.dl||0} downloads</div>`).join("");
if(tab=="Dashboard"){const wr=db.items.map(x=>{const u=x.type=="movie"?x.downloads||[]:x.seasons.flatMap(z=>z.eps),w=[];if(!u.length)w.push("no download links");if(u.some(e=>/DEMO/.test(e.url)))w.push("demo links");else if(u.some(e=>!/mediafire\.com/i.test(e.url)))w.push("non-MediaFire link");return w.length?`<div class="sub2">⚠ ${esc(x.title)}: ${w.join(", ")}</div>`:""}).join("");
h+="<h3>Needs attention</h3>"+(wr||'<p class="mu">Every title has links.</p>')+`<p class="mu">Hidden drafts: ${db.items.filter(x=>x.hidden).length} • Open broken-link reports: ${(db.reports||[]).length}</p>`}
const bar='<div class="row">'+b("pall","","","","☑ Select all")+[["feat","Feature"],["unfeat","Unfeature"],["trend","Trend"],["untrend","Untrend"],["hide","Hide"],["show","Show"],["del","Delete"]].map(([o,l])=>b("bk",o,"","",l,o=="del"?"dan":"")).join("")+"</div>";
const top=x=>`<input type="checkbox" data-a="pick" data-i="${x.id}" ${sel.has(x.id)?"checked":""} aria-label="Select ${esc(x.title)}" style="width:auto"> <b>${esc(x.title)}</b> ${b("dup",x.id,0,0,"Duplicate")}${b("ed",x.id,0,0,"Edit")}${b("del",x.id,0,0,"Delete","dan")}${b("ft",x.id,0,0,x.featured?"★ Featured ON":"☆ Featured OFF")}${b("tr",x.id,0,0,x.trending?"🔥 Trending ON":"Trending OFF")}${b("hero",x.id,0,0,"Set as hero")}${b("hd",x.id,0,0,x.hidden?"🙈 Hidden":"👁 Visible")} <small>${x.dl||0} downloads</small>`;
if(tab=="Cartoons"||tab=="Anime")h+=bar+b(tab=="Anime"?"addA":"addC","","","","+ Add "+(tab=="Anime"?"anime":"cartoon"),"pri")+mine(tab=="Anime"?"anime":"cartoon").map(c=>`<div class="row">${top(c)}${b("addS",c.id,0,0,"+ Season")}${c.releaseAt>Date.now()?'<small>⏳ Release countdown active</small>':""}`+c.seasons.map(s=>`<div class="sub"><b>Season ${s.num} ${esc(s.name)}</b> ${b("edS",c.id,s.id,0,"Edit")}${b("delS",c.id,s.id,0,"Delete","dan")}${b("addE",c.id,s.id,0,"+ Episode")}${b("bulk",c.id,s.id,0,"+ Bulk episodes")}`+s.eps.map(e=>`<div class="sub2">E${e.num} ${esc(e.title)} • ${esc(e.quality)} • ${esc(e.size)} ${b("edE",c.id,s.id,e.id,"Edit")}${b("delE",c.id,s.id,e.id,"Delete","dan")}</div>`).join("")+"</div>").join("")+"</div>").join("")||"";
if(tab=="Movies")h+=bar+b("addM","","","","+ Add movie","pri")+mine("movie").map(m=>`<div class="row">${top(m)}${b("addD",m.id,0,0,"+ Download")}${b("bulkD",m.id,0,0,"+ Bulk downloads")}`+m.downloads.map((d,n)=>`<div class="sub2">${esc(d.quality)} • ${esc(d.size)} ${b("edD",m.id,n,0,"Edit")}${b("delD",m.id,n,0,"Delete","dan")}</div>`).join("")+"</div>").join("");
if(tab=="Ratings")h+=b("rall","","","","Reset all ratings","dan")+`<div class="tw"><table><tr><th>Title<th>Average<th>Total<th>1★<th>2★<th>3★<th>4★<th>5★<th></tr>${db.items.map(x=>`<tr><td>${esc(x.title)}<td>${calculateAverageRating(x.ratings).toFixed(1)}<td>${cnt(x.ratings)}${x.ratings.map(n=>`<td>${n}`).join("")}<td>${b("sr",x.id,0,0,"Set counts")}${b("rr",x.id,0,0,"Reset","dan")}`).join("")}</table></div>`;

if(tab=="Security")h+=`<p>Status: <b>${fbOn&&FIREBASE_LOGIN?"🔒 Secure: Firebase admin login required to change anything":"⚠ Not secure: anyone can edit your database"}</b></p>`+(fbOn&&FIREBASE_LOGIN&&fbAuth.currentUser?`<p>Signed in as ${esc(fbAuth.currentUser.email)}</p>`+b("pwr","","","","Send password reset email")+b("out","","","","Sign out"):'<p class="mu">To turn protection on: set FIREBASE_LOGIN=true in index.html and publish the secure Firestore rules.</p>')+'<p class="mu">The admin code only hides the button. The Firebase login and rules are what actually protect your data.</p>';
if(tab=="Announcements")h+=b("addN","","","","+ Add announcement","pri")+db.announcements.map(a=>`<div class="row">${esc(a.text)} <small>${a.on?"Enabled":"Disabled"}</small>${b("edN",a.id,0,0,"Edit")}${b("tgN",a.id,0,0,a.on?"Disable":"Enable")}${b("delN",a.id,0,0,"Delete","dan")}</div>`).join("");
